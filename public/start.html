<style>
  :root {
    --warm-noir: #1A1614;
    --warm-noir-2: #221C1A;
    --warm-noir-3: #261F1C;
    --porcelain: #FBF7F3;
    --porcelain-soft: rgba(251, 247, 243, 0.78);
    --porcelain-mute: rgba(251, 247, 243, 0.55);
    --deep-rose: #8B3A4A;
    --dusty-rose: #B06B72;
    --rose-mist: #D4A5A8;
    --aged-gold: #B08D3E;
    --gold-warm: #C9A854;
    --gold-haze: #E2CDA0;
    --sand-gold: #E4CFA0;
    --graphite: #6B6360;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--warm-noir);
    color: var(--porcelain);
    font-family: 'Instrument Sans', -apple-system, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Velvet texture - Karti signature */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(139, 58, 74, 0.025) 0px,
      rgba(139, 58, 74, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Architectural arc */
  .arc {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    border: 1px solid var(--gold-warm);
    border-radius: 50%;
    opacity: 0.06;
    pointer-events: none;
    z-index: 1;
  }

  /* Container */
  .page {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 36px 28px 56px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Wordmark top */
  .wordmark-top {
    text-align: center;
    margin-bottom: 64px;
  }
  .wordmark-top span {
    font-family: 'Italiana', serif;
    font-size: 14px;
    letter-spacing: 0.5em;
    color: var(--gold-warm);
    padding-left: 0.5em;
  }

  .gold-mini {
    width: 32px;
    height: 1px;
    background: var(--aged-gold);
    margin: 14px auto 0;
    opacity: 0.6;
  }

  /* HERO */
  .hero {
    text-align: center;
    margin-bottom: 56px;
  }

  .photo-frame {
    width: 180px;
    height: 180px;
    margin: 0 auto 32px;
    border-radius: 50%;
    border: 1px solid var(--gold-warm);
    padding: 6px;
    position: relative;
  }

  .photo-frame::before {
    content: "";
    position: absolute;
    inset: -8px;
    border: 1px solid var(--aged-gold);
    border-radius: 50%;
    opacity: 0.25;
  }

  .hero-name {
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: 44px;
    line-height: 1.05;
    color: var(--porcelain);
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }

  .hero-role {
    font-family: 'Work Sans', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.36em;
    color: var(--gold-warm);
    padding-left: 0.36em;
    margin-bottom: 22px;
  }

  .hero-tagline {
    font-family: 'Lora', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.45;
    color: var(--gold-haze);
    max-width: 320px;
    margin: 0 auto;
    letter-spacing: 0.005em;
  }

  /* Gold divider */
  .gold-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      var(--aged-gold) 30%,
      var(--aged-gold) 70%,
      transparent 100%
    );
    opacity: 0.4;
    margin: 0 0 48px;
  }

  /* Blocks */
  .blocks {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 56px;
  }

  .block {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--warm-noir-2);
    border: 1px solid rgba(176, 141, 62, 0.22);
    border-radius: 2px;
    padding: 26px 28px;
    transition: all 0.32s cubic-bezier(0.2, 0.6, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .block::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--gold-warm);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.4s cubic-bezier(0.2, 0.6, 0.2, 1);
  }

  .block:hover,
  .block:focus-visible {
    border-color: rgba(201, 168, 84, 0.55);
    background: var(--warm-noir-3);
    transform: translateY(-1px);
    outline: none;
  }

  .block:hover::before,
  .block:focus-visible::before {
    transform: scaleY(1);
  }

  .block-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .block-content {
    flex: 1;
    min-width: 0;
  }

  .block-label {
    font-family: 'Work Sans', sans-serif;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--gold-warm);
    margin-bottom: 8px;
    padding-left: 0.3em;
  }

  .block-title {
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.25;
    color: var(--porcelain);
    letter-spacing: -0.005em;
  }

  .block-arrow {
    font-family: 'Lora', serif;
    font-size: 24px;
    color: var(--gold-warm);
    font-weight: 300;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.32s cubic-bezier(0.2, 0.6, 0.2, 1);
  }

  .block:hover .block-arrow,
  .block:focus-visible .block-arrow {
    transform: translateX(4px);
  }

  /* Premium block (match call) */
  .block-premium {
    background: linear-gradient(135deg, #2A211C 0%, var(--warm-noir-2) 100%);
    border-color: var(--aged-gold);
  }

  .block-premium::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(
        ellipse at 100% 50%,
        rgba(212, 165, 168, 0.07) 0%,
        transparent 60%
      );
    pointer-events: none;
  }

  .block-premium .block-label { color: var(--gold-haze); }

  /* Channels */
  .channels {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 56px;
  }

  .channel {
    color: var(--porcelain-soft);
    text-decoration: none;
    font-family: 'Work Sans', sans-serif;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    transition: all 0.28s cubic-bezier(0.2, 0.6, 0.2, 1);
    padding-left: 0.28em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 4px 8px;
  }

  .channel-icon {
    width: 22px;
    height: 22px;
    color: var(--gold-warm);
    transition: transform 0.32s cubic-bezier(0.2, 0.6, 0.2, 1);
  }

  .channel:hover {
    color: var(--gold-warm);
  }

  .channel:hover .channel-icon {
    transform: translateY(-2px);
    color: var(--gold-haze);
  }

  /* Footer wordmark */
  .footer {
    margin-top: auto;
    text-align: center;
    padding-top: 32px;
  }

  .footer-divider {
    width: 24px;
    height: 1px;
    background: var(--aged-gold);
    opacity: 0.4;
    margin: 0 auto 22px;
  }

  .wordmark-bottom {
    font-family: 'Italiana', serif;
    font-size: 22px;
    letter-spacing: 0.6em;
    color: var(--gold-warm);
    padding-left: 0.6em;
  }

  /* Mobile tweaks */
  @media (max-width: 420px) {
    .page { padding: 28px 22px 48px; }
    .photo-frame { width: 156px; height: 156px; }
    .hero-name { font-size: 38px; }
    .hero-role { font-size: 10px; letter-spacing: 0.32em; }
    .block { padding: 22px 22px; }
    .block-title { font-size: 19px; }
    .channels { gap: 22px; }
    .channel { font-size: 10px; }
    .channel-icon { width: 20px; height: 20px; }
  }

  /* Entrance animations */
  @media (prefers-reduced-motion: no-preference) {
    .hero, .blocks > *, .channels, .footer {
      animation: fadeUp 0.7s cubic-bezier(0.2, 0.6, 0.2, 1) backwards;
    }
    .hero { animation-delay: 0.05s; }
    .gold-divider { animation: fadeIn 0.8s 0.2s backwards; }
    .blocks > *:nth-child(1) { animation-delay: 0.28s; }
    .blocks > *:nth-child(2) { animation-delay: 0.36s; }
    .channels { animation-delay: 0.5s; }
    .footer { animation-delay: 0.6s; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 0.4; }
  }
</style>
