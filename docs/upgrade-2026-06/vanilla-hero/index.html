<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karti hero — vanilla referentie-implementatie</title>
<!--
  KARTI HERO · VANILLA VARIANT (geen framework)
  ─────────────────────────────────────────────
  Drie progressieve lagen, identiek aan de Next.js-versie:
  1. Statische HTML/CSS — werkt overal, ook zonder JavaScript.
  2. SVG-wortelsysteem dat zichzelf tekent met pure CSS-animatie
     (zelfde geometrie als de productie-site, gegenereerd uit
     src/lib/roots.ts met seed 20260330).
  3. Optionele three.js-diepte (CDN, ES modules) — alleen geladen op
     apparaten die WebGL2 aankunnen, buiten Instagram/TikTok in-app
     browsers, en zonder prefers-reduced-motion.

  Plak de sectie in elke statische pagina; alles staat in dit bestand.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Lora:ital,wght@0,700;1,400&family=Instrument+Sans:wght@400;600&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Dawn tokens ───────────────────────────── */
  :root {
    --sandstone: #f2eae0;
    --morning: #faf6f0;
    --espresso: #2e2622;
    --bark: #3d3228;
    --gold: #b08d3e;
    --gold-warm: #c9a854;
    --gold-text: #80662c;      /* AA op licht (4.6:1) */
    --stone-text: #6e6557;     /* AA op licht (4.8:1) */
    --rose-deep: #8b3a4a;
    --ease-organic: cubic-bezier(.16,.84,.32,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--sandstone);
    color: var(--espresso);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--gold-text); outline-offset: 3px; }

  /* ── Hero layout ───────────────────────────── */
  .hero { position: relative; overflow: hidden; min-height: 88vh; }
  .hero-inner {
    position: relative;
    max-width: 1440px;
    margin-inline: auto;
    padding: 64px 24px 200px;
    display: grid;
    gap: 56px;
    align-items: center;
  }
  @media (min-width: 1024px) {
    .hero-inner { grid-template-columns: 1.05fr .95fr; padding: 96px 64px 220px; }
  }
  .label {
    font-family: "Work Sans", sans-serif;
    font-size: 12px; font-weight: 500;
    letter-spacing: .25em; text-transform: uppercase;
    color: var(--gold-text);
    margin-bottom: 24px;
  }
  h1 {
    font-family: "Lora", serif;
    font-weight: 700;
    font-size: clamp(34px, 8.4vw, 68px);
    line-height: 1.05; letter-spacing: -.015em;
    color: var(--bark);
    text-wrap: balance;
  }
  .divider { width: 80px; height: 1px; background: var(--gold); opacity: .5; border: 0; margin: 28px 0; }
  .quote {
    font-family: "Lora", serif; font-style: italic;
    font-size: clamp(22px, 2.2vw, 32px); line-height: 1.4;
    color: var(--bark); margin-bottom: 36px;
  }
  .quote em { font-style: italic; color: var(--rose-deep); }
  .cta-rij { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Work Sans", sans-serif; font-weight: 700;
    font-size: 14px; letter-spacing: .16em; text-transform: uppercase;
    white-space: nowrap; padding: 18px 40px; border-radius: 999px;
    text-decoration: none; transition: background .25s ease;
  }
  .btn-goud { background: var(--gold); color: var(--espresso); }
  .btn-goud:hover { background: #9a7a35; }
  .btn-omlijnd { border: 1px solid var(--gold); color: var(--espresso); }
  .btn-omlijnd:hover { background: rgba(176,141,62,.1); }
  .cta-sub {
    font-family: "Work Sans", sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: .25em; text-transform: uppercase;
    color: var(--stone-text); margin-top: 20px;
  }
  .trust { display: flex; align-items: center; gap: 12px; margin-top: 36px; font-size: 15px; }
  .trust::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--gold); opacity: .8; }

  /* ── Portret in fine-line ringen ───────────── */
  .portret { position: relative; justify-self: center; width: min(58vw, 250px); aspect-ratio: 1; }
  @media (min-width: 1024px) { .portret { width: 400px; justify-self: end; } }
  .portret::before, .portret::after {
    content: ""; position: absolute; border-radius: 999px; border: 1px solid var(--gold-warm);
  }
  .portret::before { inset: -20px; opacity: .4; }
  .portret::after { inset: -40px; opacity: .2; }
  .portret img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 999px;
    border: 1px solid rgba(176,141,62,.6); background: var(--morning);
    transform: scale(1.0); display: block;
  }

  /* ── Hero entrance: puur CSS, geen JS nodig ── */
  @keyframes hero-enter { to { opacity: 1; transform: translateY(0); } }
  .enter { opacity: 0; transform: translateY(18px); animation: hero-enter .8s var(--ease-organic) forwards; animation-delay: var(--d, 0ms); }

  /* ── Wortelsysteem (SVG, CSS draw-in) ──────── */
  .roots {
    position: absolute; inset-inline: 0; bottom: 0; height: 52%;
    pointer-events: none; user-select: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 78%, transparent 100%);
  }
  @media (min-width: 1024px) { .roots { height: 68%; } }
  .roots svg { width: 100%; height: 100%; transition: opacity .6s ease; }
  .roots svg.gl-active { opacity: 0; }
  .roots canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes roots-draw { to { stroke-dashoffset: 0; } }
  .roots-path {
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
    animation: roots-draw var(--dur, 2400ms) cubic-bezier(.25,.6,.3,1) var(--delay, 0ms) forwards;
  }
  @keyframes roots-dot-in { to { opacity: var(--dot-o, .8); } }
  .roots-dot { opacity: 0; animation: roots-dot-in .7s ease-out var(--delay, 0ms) forwards; }

  @media (prefers-reduced-motion: reduce) {
    .enter { opacity: 1; transform: none; animation: none; }
    .roots-path { stroke-dashoffset: 0; animation: none; }
    .roots-dot { opacity: var(--dot-o, .8); animation: none; }
  }
</style>
</head>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }

<script type="module">
/* Optionele WebGL-diepte. Zelfde poortwachters als productie:
   reduced-motion, save-data, weinig geheugen/cores, in-app browsers
   en ontbrekend WebGL2 krijgen alleen de (volwaardige) SVG. */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const inApp = /instagram|fban|fbav|fb_iab|tiktok|musical_ly|bytedance|snapchat|pinterest|line\//i.test(navigator.userAgent);
const zwak = (navigator.deviceMemory ?? 8) < 4 || (navigator.hardwareConcurrency ?? 8) < 4 || navigator.connection?.saveData;
const test = document.createElement("canvas").getContext("webgl2", { failIfMajorPerformanceCaveat: true });

if (!reduced && !inApp && !zwak && test) {
  test.getExtension("WEBGL_lose_context")?.loseContext();
  const start = () => import("three").then(initScene).catch(() => {});
  "requestIdleCallback" in window ? requestIdleCallback(start, { timeout: 2500 }) : setTimeout(start, 1400);
}

function initScene(THREE) {
  const houder = document.querySelector(".roots");
  const svg = document.getElementById("roots-svg");

  // geometrie rechtstreeks uit de SVG lezen → één bron van waarheid
  const paden = [...svg.querySelectorAll(".roots-path")];
  const dots = [...svg.querySelectorAll(".roots-dot")];

  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  const cam = new THREE.OrthographicCamera(0, 1, 1, 0, .1, 100);
  cam.position.z = 10;

  const groep = new THREE.Group();
  scene.add(groep);
  const S = 1 / 95, sx = x => (x - 500) * S, sy = y => (300 - y) * S;

  const lijnen = paden.map(p => {
    const len = p.getTotalLength();
    const n = Math.max(12, Math.round(len / 14));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = p.getPointAtLength((i / n) * len);
      pts.push(new THREE.Vector3(sx(q.x), sy(q.y), (Math.sin(p.getAttribute("d").length + i) * .3)));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
      color: new THREE.Color(p.getAttribute("stroke")),
      transparent: true,
      opacity: parseFloat(p.getAttribute("opacity")) + .08,
    });
    const lijn = new THREE.Line(geo, mat);
    lijn.userData = {
      totaal: n + 1,
      delay: parseFloat(p.style.getPropertyValue("--delay")) / 1000,
      dur: parseFloat(p.style.getPropertyValue("--dur")) / 1000,
    };
    lijn.geometry.setDrawRange(0, 0);
    groep.add(lijn);
    return lijn;
  });

  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute("position", new THREE.Float32BufferAttribute(
    dots.flatMap(d => [sx(+d.getAttribute("cx")), sy(+d.getAttribute("cy")), 0]), 3));
  const dotCanvas = document.createElement("canvas");
  dotCanvas.width = dotCanvas.height = 64;
  const dctx = dotCanvas.getContext("2d");
  dctx.beginPath(); dctx.arc(32, 32, 28, 0, Math.PI * 2); dctx.fillStyle = "#fff"; dctx.fill();
  const dotMat = new THREE.PointsMaterial({
    color: 0xb08d3e, size: 4.5, sizeAttenuation: false, transparent: true, opacity: 0,
    map: new THREE.CanvasTexture(dotCanvas), alphaTest: .4, depthWrite: false,
  });
  groep.add(new THREE.Points(dotGeo, dotMat));

  function maat() {
    const r = houder.getBoundingClientRect();
    renderer.setSize(r.width, r.height);
    const zoom = r.height / (600 * S);
    const halfB = r.width / 2 / zoom, halfH = r.height / 2 / zoom;
    cam.left = -halfB; cam.right = halfB; cam.top = halfH; cam.bottom = -halfH;
    cam.updateProjectionMatrix();
    groep.position.y = halfH - sy(0);
  }
  maat();
  addEventListener("resize", maat, { passive: true });
  houder.appendChild(renderer.domElement);

  let doelRX = 0, doelRY = 0;
  addEventListener("mousemove", e => {
    doelRY = (e.clientX / innerWidth * 2 - 1) * .055;
    doelRX = -(e.clientY / innerHeight * 2 - 1) * .03;
  }, { passive: true });

  const klok = new THREE.Clock();
  let eerste = true;
  renderer.setAnimationLoop(() => {
    const t = klok.getElapsedTime();
    for (const l of lijnen) {
      const { totaal, delay, dur } = l.userData;
      const k = Math.min(1, Math.max(0, (t - delay) / dur));
      l.geometry.setDrawRange(0, Math.round(totaal * (1 - Math.pow(1 - k, 3))));
    }
    dotMat.opacity = Math.min(1, Math.max(0, (t - 2.6) / 1.2)) * .85;
    groep.rotation.y += (doelRY - groep.rotation.y) * .03;
    groep.rotation.x += (doelRX - groep.rotation.x) * .03;
    renderer.render(scene, cam);
    if (eerste) { eerste = false; requestAnimationFrame(() => svg.classList.add("gl-active")); }
  });
}
</script>
